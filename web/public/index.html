<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover 없으면 env(safe-area-inset-*) 가 전부 0 이라 iOS 홈 인디케이터에 탭바가 깔린다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>오늘 뭐 깨지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // ── 모바일 레이아웃 게이트 ────────────────────────────────────────
    // 미디어쿼리만으로는 부족하다: 디자인 캡처(?w=390)는 #app 의 폭만 좁히고
    // 뷰포트는 그대로라 @media (max-width) 가 걸리지 않는다. 그래서 클래스로 켠다 —
    // 실제로 좁은 화면이거나, ?w 가 모바일 폭으로 지정된 경우.
    // 첫 페인트 전에 켜야 데스크톱 레이아웃이 번쩍이지 않으므로 head 안에서 실행한다.
    (function () {
      var MOBILE_MAX = 780;
      var pinned = parseInt(new URLSearchParams(location.search).get('w'), 10);
      var forced = pinned >= 320 && pinned <= MOBILE_MAX;
      var mq = window.matchMedia('(max-width: ' + MOBILE_MAX + 'px)');
      var apply = function () {
        document.documentElement.classList.toggle('mobile', forced || mq.matches);
        // 클래스가 바뀌면 모바일에서만 켜지는 것들을 다시 물려야 한다.
        // resize 는 미디어쿼리 평가보다 먼저 돌아서 낡은 값을 읽으므로,
        // resize 리스너에만 맡기면 경계를 넘는 순간 가로 스크롤 페이드가 빠진다.
        if (window.onBreakpointChange) window.onBreakpointChange();
      };
      apply();
      if (mq.addEventListener) mq.addEventListener('change', apply); else mq.addListener(apply);
    })();
  </script>
</head>
<body>
  <!-- 로그인 화면 -->
  <!-- 로그인 여부는 서버 쿠키라 파싱 시점엔 알 수 없다. 둘 다 숨겨두고
       /api/me 응답 뒤에 하나만 연다 — 안 그러면 새로고침마다 로그인 화면이 번쩍인다.
       그 사이를 비워두면 흰 화면이 첫인상이 되므로 스플래시를 깐다. -->
  <div id="boot">
    <div class="boot-mark"><img src="logo.svg" alt="" width="26" height="26"><span>오늘 뭐 깨지</span></div>
    <div class="gd-spinner"></div>
    <div class="boot-sub" data-i18n="bootLoading">불러오는 중…</div>
  </div>

  <div id="loginScreen" class="login-screen hidden">
    <div class="corner-lang lang-switch" id="langSwitchLogin">
      <button data-lang="ko">한국어</button><button data-lang="en">English</button>
    </div>
    <div class="login-box">
      <div class="login-prompt"><span class="lp-sign">$</span> whatnow --today<i class="caret"></i></div>
      <h1 data-i18n="appTitle">오늘 뭐 깨지</h1>
      <p class="login-lead" data-i18n="loginLead">라이브러리는 꽉 찼는데, 켤 게 없다.</p>
      <p class="login-desc" data-i18n="loginDesc">안 깬 도전과제 중 하나를 골라 오늘의 목표로 만들어 드려요.</p>
      <button class="steam-login" id="login" data-i18n="loginBtn">Steam으로 로그인</button>
      <p class="login-note"><span data-i18n="loginNote">Steam OpenID로 인증합니다 · 비밀번호는 받지 않아요</span></p>
    </div>
  </div>

  <!-- 앱 셸 -->
  <div id="app" class="app hidden">
    <!-- 모바일 상단바 — 한 줄만. 로고 + 현재 화면 이름 + 아바타(더보기) 하나.
         프로필·언어·로그아웃을 매 화면 위에 쌓아두면 스크롤 없이는 콘텐츠가
         시작조차 안 된다. 그래서 전부 아바타 뒤 시트로 넣었다. -->
    <header class="mtopbar">
      <img class="mtb-logo" src="logo.svg" alt="" width="18" height="18" />
      <span class="mtb-title" id="mTitle"></span>
      <button class="mtb-more" id="mMore" aria-expanded="false" aria-controls="lnbSheet" data-i18n-label="openMenu" aria-label="메뉴 열기">
        <img class="mtb-avatar" id="mAvatar" alt="" />
        <!-- 동기화가 필요/실패하면 시트가 닫혀 있어도 여기서 알린다 -->
        <span class="mtb-dot hidden" id="mMoreDot"></span>
      </button>
    </header>

    <!-- LNB (데스크톱) = 시트 내용 (모바일) — 프로필·동기화 DOM 을 한 벌만 둔다.
         복제하면 renderProfile 이 두 곳을 갱신해야 하고 한쪽이 반드시 낡는다. -->
    <aside class="lnb" id="lnbSheet">
      <!-- 모바일 시트 손잡이 — 데스크톱에선 안 보인다 -->
      <div class="sheet-head">
        <span class="sheet-grip" aria-hidden="true"></span>
        <button class="sheet-close" id="sheetClose" data-i18n-label="close" aria-label="닫기">✕</button>
      </div>
      <div class="brand"><img class="brand-sign" src="logo.svg" alt="" width="18" height="18"><span>오늘 뭐 깨지</span></div>

      <div class="profile" id="profile">
        <img id="avatar" class="avatar" />
        <div class="profile-info">
          <div id="pname" class="pname"></div>
          <div id="synced" class="synced"></div>
        </div>
      </div>
      <button id="sync" class="sync-btn" data-i18n="sync">동기화</button>
      <div class="progress hidden" id="progress"></div>

      <!-- in-tabbar = 모바일 하단 탭바에도 있는 항목. 시트에서는 감춘다(중복). -->
      <nav class="lnb-nav">
        <span class="sheet-navlabel" data-i18n="menuMore">더보기</span>
        <button class="nav-item in-tabbar active" data-view="daily"><span data-i18n="navDaily">오늘의 도전</span></button>
        <button class="nav-item in-tabbar" data-view="resume"><span data-i18n="navResume">이어하기</span></button>
        <button class="nav-item in-tabbar" data-view="games"><span data-i18n="navGames">내 게임</span></button>
        <button class="nav-item in-tabbar" data-view="ach"><span data-i18n="navAch">도전과제</span></button>
        <button class="nav-item" data-view="friends"><span data-i18n="navFriends">친구랑</span></button>
      </nav>

      <div class="lnb-bottom">
        <div class="lang-switch" id="langSwitch">
          <button data-lang="ko">한국어</button><button data-lang="en">English</button>
        </div>
        <button id="logout" class="logout" data-i18n="logout">로그아웃</button>
      </div>
    </aside>
    <div class="sheet-scrim" id="sheetScrim"></div>

    <!-- 메인 -->
    <main class="main">
      <!-- 뷰: 오늘의 도전 (뽑기 루프) -->
      <section id="view-daily" class="view">
        <div id="dailyContent"></div>
      </section>

      <!-- 뷰: 랜덤 스핀 -->
      <section id="view-spin" class="view hidden spin-view">
        <div class="spin-stage" id="spinStage">
          <div class="coverflow" id="coverflow"></div>
        </div>
        <div class="pick" id="pick">
          <div class="pick-name" id="pickName"></div>
          <div class="pick-reason" id="pickReason"></div>
          <div class="pick-hint" id="pickHint"></div>
        </div>
        <div class="spin-actions">
          <a class="pick-play" id="pickPlay" href="#">▶ <span data-i18n="play">실행</span></a>
          <button class="reroll" id="reroll"><span data-i18n="reroll">돌려!</span></button>
        </div>
      </section>

      <!-- 뷰: 이어하기 -->
      <section id="view-resume" class="view hidden">
        <h2 data-i18n="resumeTitle">이어하기</h2>
        <p class="view-lead" data-i18n="resumeLead">멈춘 지점을 그대로 복원해뒀어요.</p>
        <div id="resumeContent"></div>
      </section>


      <!-- 뷰: 내 게임 -->
      <section id="view-games" class="view hidden">
        <div id="gamesBrowse">
          <h2 data-i18n="navGames">내 게임</h2>
          <input type="text" id="gameSearch" class="search" data-i18n-ph="searchGames" placeholder="게임 검색…" />
          <!-- 정렬은 검색 바로 아래. 드롭다운은 열어봐야 뭐가 있는지 알지만
               버튼은 선택지와 현재 상태가 한눈에 보인다. -->
          <div class="sort-bar" id="gameSort" role="group" aria-label="정렬">
            <span class="sort-bar-label" data-i18n="sortLabel">정렬</span>
            <button class="sort-btn active" data-sort="recent" data-i18n="sortRecent">최근 플레이 순</button>
            <button class="sort-btn" data-sort="oldest" data-i18n="sortOldest">오래전 플레이 순</button>
            <button class="sort-btn" data-sort="ach-desc" data-i18n="sortAchDesc">달성률 높은 순</button>
            <button class="sort-btn" data-sort="ach-asc" data-i18n="sortAchAsc">달성률 낮은 순</button>
          </div>
          <div id="gameGrid" class="game-grid"></div>
        </div>
        <div id="gameDetail" class="game-detail hidden"></div>
      </section>

      <!-- 뷰: 도전과제 -->
      <section id="view-ach" class="view hidden">
        <h2 data-i18n="navAch">도전과제</h2>
        <div class="subtabs" id="achSubtabs">
          <button class="subtab active" data-group="collected" data-i18n="tabCollected">모은 것</button>
          <button class="subtab" data-group="targets" data-i18n="tabTargets">노릴 것</button>
          <button class="subtab" data-group="game" data-i18n="tabGame">게임별</button>
        </div>
        <div id="achWarn" class="ach-warn hidden">
          ⚠️ <span data-i18n="achBlocked">도전과제가 비공개예요. Steam → 프로필 편집 → 개인정보에서 "게임 세부 정보"를 공개로 바꾸고 다시 동기화하세요.</span>
          <a class="ach-warn-link" href="https://steamcommunity.com/my/edit/settings" target="_blank" rel="noopener" data-i18n="openSteamSettings">🔧 Steam 개인정보 설정 열기</a>
        </div>
        <div id="achContent" class="ach-content"></div>
      </section>

      <!-- 뷰: 친구랑 -->
      <section id="view-friends" class="view hidden">
        <h2 data-i18n="navFriends">친구랑 할 게임</h2>
        <div class="progress hidden" id="friendProgress"></div>
        <div id="friendList" class="friend-list"></div>
      </section>
    </main>

    <!-- 모바일 하단 탭바 — 엄지 도달 범위에 4개가 한계다. '친구랑'은 5번째 탭이
         아니라 더보기 시트로 뺐다. 아이콘은 이모지 대신 기하 문양(로고·프롬프트와 같은 계열).
         .nav-item 클래스를 그대로 쓴다 — 활성 표시와 클릭 처리를 app.js 가 이미 한다. -->
    <nav class="tabbar" id="tabbar">
      <button class="nav-item tab" data-view="daily"><span class="tab-ico" aria-hidden="true">◆</span><span class="tab-label" data-i18n="tabDaily">오늘</span></button>
      <button class="nav-item tab" data-view="resume"><span class="tab-ico" aria-hidden="true">↺</span><span class="tab-label" data-i18n="tabResume">이어하기</span></button>
      <button class="nav-item tab" data-view="games"><span class="tab-ico" aria-hidden="true">▦</span><span class="tab-label" data-i18n="tabGames">내 게임</span></button>
      <button class="nav-item tab" data-view="ach"><span class="tab-ico" aria-hidden="true">★</span><span class="tab-label" data-i18n="tabAch">도전과제</span></button>
    </nav>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
