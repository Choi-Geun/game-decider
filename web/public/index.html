<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 뭐 깨지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 로그인 화면 -->
  <div id="loginScreen" class="login-screen">
    <div class="corner-lang lang-switch" id="langSwitchLogin">
      <button data-lang="ko">한국어</button><button data-lang="en">English</button>
    </div>
    <div class="login-box">
      <div class="login-prompt"><span class="lp-sign">$</span> whatnow --today<i class="caret"></i></div>
      <h1 data-i18n="appTitle">오늘 뭐 깨지</h1>
      <p class="login-lead" data-i18n="loginLead">라이브러리는 꽉 찼는데, 켤 게 없다.</p>
      <p class="login-desc" data-i18n="loginDesc">안 깬 도전과제 중 하나를 골라 오늘의 목표로 만들어 드려요.</p>
      <button class="steam-login" id="login" data-i18n="loginBtn">Steam으로 로그인</button>
      <p class="login-note"><span data-i18n="loginNote">Steam OpenID로 인증합니다 · 비밀번호는 받지 않아요</span></p>
    </div>
  </div>

  <!-- 앱 셸 -->
  <div id="app" class="app hidden">
    <!-- LNB -->
    <aside class="lnb">
      <div class="brand"><span class="brand-sign">▚</span> <span>오늘 뭐 깨지</span></div>

      <div class="profile" id="profile">
        <img id="avatar" class="avatar" />
        <div class="profile-info">
          <div id="pname" class="pname"></div>
          <div id="synced" class="synced"></div>
        </div>
      </div>
      <button id="sync" class="sync-btn" data-i18n="sync">🔄 동기화</button>
      <div class="progress hidden" id="progress"></div>

      <nav class="lnb-nav">
        <button class="nav-item active" data-view="daily">🎴 <span data-i18n="navDaily">오늘의 도전</span></button>
        <button class="nav-item" data-view="spin">🎰 <span data-i18n="navSpin">랜덤 스핀</span></button>
        <button class="nav-item" data-view="resume">↩️ <span data-i18n="navResume">이어하기</span></button>
        <button class="nav-item" data-view="games">🎮 <span data-i18n="navGames">내 게임</span></button>
        <button class="nav-item" data-view="ach">🏆 <span data-i18n="navAch">도전과제</span></button>
        <button class="nav-item" data-view="friends">👥 <span data-i18n="navFriends">친구랑</span></button>
      </nav>

      <div class="lnb-bottom">
        <div class="lang-switch" id="langSwitch">
          <button data-lang="ko">한국어</button><button data-lang="en">English</button>
        </div>
        <button id="logout" class="logout" data-i18n="logout">로그아웃</button>
      </div>
    </aside>

    <!-- 메인 -->
    <main class="main">
      <!-- 뷰: 오늘의 도전 (뽑기 루프) -->
      <section id="view-daily" class="view">
        <div id="dailyContent"></div>
      </section>

      <!-- 뷰: 랜덤 스핀 -->
      <section id="view-spin" class="view hidden spin-view">
        <div class="spin-stage" id="spinStage">
          <div class="coverflow" id="coverflow"></div>
        </div>
        <div class="pick" id="pick">
          <div class="pick-name" id="pickName"></div>
          <div class="pick-reason" id="pickReason"></div>
          <div class="pick-hint" id="pickHint"></div>
          <a class="pick-play" id="pickPlay" href="#">▶ <span data-i18n="play">실행</span></a>
        </div>
        <button class="reroll" id="reroll">🎲 <span data-i18n="reroll">돌려!</span></button>
      </section>

      <!-- 뷰: 이어하기 -->
      <section id="view-resume" class="view hidden">
        <h2 data-i18n="resumeTitle">이어하기</h2>
        <p class="view-lead" data-i18n="resumeLead">멈춘 지점을 그대로 복원해뒀어요.</p>
        <div id="resumeContent"></div>
      </section>


      <!-- 뷰: 내 게임 -->
      <section id="view-games" class="view hidden">
        <div id="gamesBrowse">
          <h2 data-i18n="navGames">내 게임</h2>
          <input type="text" id="gameSearch" class="search" data-i18n-ph="searchGames" placeholder="게임 검색…" />
          <div id="gameGrid" class="game-grid"></div>
        </div>
        <div id="gameDetail" class="game-detail hidden"></div>
      </section>

      <!-- 뷰: 도전과제 -->
      <section id="view-ach" class="view hidden">
        <h2 data-i18n="navAch">도전과제</h2>
        <div class="subtabs" id="achSubtabs">
          <button class="subtab active" data-group="collected" data-i18n="tabCollected">모은 것</button>
          <button class="subtab" data-group="targets" data-i18n="tabTargets">노릴 것</button>
          <button class="subtab" data-group="game" data-i18n="tabGame">게임별</button>
        </div>
        <div id="achWarn" class="ach-warn hidden">
          ⚠️ <span data-i18n="achBlocked">도전과제가 비공개예요. Steam → 프로필 편집 → 개인정보에서 "게임 세부 정보"를 공개로 바꾸고 다시 동기화하세요.</span>
          <a class="ach-warn-link" href="https://steamcommunity.com/my/edit/settings" target="_blank" rel="noopener" data-i18n="openSteamSettings">🔧 Steam 개인정보 설정 열기</a>
        </div>
        <div id="achContent" class="ach-content"></div>
      </section>

      <!-- 뷰: 친구랑 -->
      <section id="view-friends" class="view hidden">
        <h2 data-i18n="navFriends">친구랑 할 게임</h2>
        <div class="progress hidden" id="friendProgress"></div>
        <div id="friendList" class="friend-list"></div>
      </section>
    </main>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
